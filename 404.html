<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Sopplayer</title>
  <link rel="icon" href="svg/play.svg" />
  <style>
    body {
      margin: 0;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 12px;
      letter-spacing: -1px;
    }
    p {
      color: #94a3b8;
      margin: 0 0 32px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #38bdf8;
      color: #090d16;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #0ea5e9;
    }
    .links {
      margin-top: 32px;
      font-size: 14px;
    }
    .links a {
      color: #38bdf8;
      text-decoration: none;
      margin: 0 8px;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Error 404</span>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been relocated as part of the Sopplayer v2.0 modernization.</p>
    <a href="/Sopplayer/" class="btn">Return to Sopplayer Home</a>
    <div class="links">
      <a href="/Sopplayer/demo/">Playground</a> &bull;
      <a href="/Sopplayer/players/">Players Gallery</a> &bull;
      <a href="https://github.com/SH20RAJ/Sopplayer">GitHub</a>
    </div>
  </div>
</body>
</html>
